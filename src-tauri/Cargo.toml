[package]
name = "innpilot"
version = "0.1.0"
description = "InnPilot"
authors = ["InnPilot"]
edition = "2021"

[lib]
name = "innpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
cloud-e2e-probe = []

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["zeroize"] }
fs2 = "0.4"
getrandom = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "time"] }
zeroize = "1"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
